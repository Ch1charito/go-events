<section class="profile">
    <div class="profile__card">
        <div class="profile__avatar">{{ displayName().charAt(0).toUpperCase() }}</div>
        <div class="profile__info">
            <h1 class="profile__name">{{ displayName() }}</h1>
            <p class="profile__email">{{ email() }}</p>
        </div>
    </div>
    @if (topInterests().length > 0) {
    <div class="profile__interests">
        <h2 class="profile__interests-heading">Deine Interessen</h2>
        <div class="profile__interests-tags">
            @for (tag of topInterests(); track tag) {
            <span class="pill">{{ tag }}</span>
            }
        </div>
        <p class="profile__interests-hint">Aus deinen Swipes gelernt. Beeinflusst die Reihenfolge im Feed.</p>
    </div>
    }
    <div class="profile__actions">
        @if (isAdmin()) {
        <a class="profile__link" routerLink="/admin">
            Admin-Panel
            <span aria-hidden="true">→</span>
        </a>
        }

        <button class="profile__logout" (click)="logout()">Ausloggen</button>
    </div>
</section>
